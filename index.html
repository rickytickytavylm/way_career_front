  </head>
  <body>
    <noscript>Для работы Т-Карьеры включите JavaScript.</noscript>

    <div id="onboarding" class="onboarding" aria-live="polite"></div>

    <div id="app" class="app is-hidden">
      <header class="mobile-header">
        <button class="brand brand--mobile" data-route="feed" aria-label="Т-Карьера, на главную">
          <span class="brand-mark">Т</span><span>Карьера</span>
        </button>
        <div class="mobile-header__actions">
          <button class="icon-button" data-route="notifications" aria-label="Уведомления">
            <span data-icon="bell"></span><span class="notification-dot"></span>
          </button>
          <button class="avatar-button" data-route="profile" aria-label="Профиль Марии">
            <img data-profile-photo alt="">
          </button>
        </div>
      </header>

      <aside class="sidebar">
        <button class="brand" data-route="feed" aria-label="Т-Карьера, на главную">
          <span class="brand-mark">Т</span><span>Карьера</span>
        </button>
        <nav class="desktop-nav" aria-label="Основная навигация">
          <p class="nav-label">Т-Карьера</p>
          <button class="nav-item is-active" data-route="feed"><span data-icon="feed"></span><span>Лента</span></button>
          <button class="nav-item" data-route="career"><span data-icon="briefcase"></span><span>Вакансии</span></button>
          <button class="nav-item" data-route="development"><span data-icon="growth"></span><span>Развитие</span></button>
          <p class="nav-label">Общение</p>
          <button class="nav-item" data-route="people"><span data-icon="people"></span><span>Люди</span></button>
          <button class="nav-item" data-route="messages"><span data-icon="message"></span><span>Сообщения</span><span class="nav-badge">3</span></button>
          <button class="nav-item" data-route="notifications"><span data-icon="bell"></span><span>Уведомления</span></button>
        </nav>
        <button class="sidebar-profile" data-route="profile">
          <img data-profile-photo alt="">
          <span><strong>Мария Воронцова</strong><small>Визионер</small></span>
          <span data-icon="chevron"></span>
        </button>
      </aside>

      <main id="main-content" class="main-content" tabindex="-1"></main>
      <aside id="right-rail" class="right-rail"></aside>

      <nav class="bottom-nav" aria-label="Мобильная навигация">
        <button class="bottom-nav__item is-active" data-route="feed"><span data-icon="feed"></span><span>Лента</span></button>
        <button class="bottom-nav__item" data-route="career"><span data-icon="briefcase"></span><span>Карьера</span></button>
        <button class="bottom-nav__item" data-route="people"><span data-icon="people"></span><span>Люди</span></button>
        <button class="bottom-nav__item" data-route="messages"><span data-icon="message"></span><span>Сообщения</span></button>
        <button class="bottom-nav__item" data-route="profile"><span data-icon="profile"></span><span>Профиль</span></button>
      </nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <input id="photo-input" type="file" accept="image/*" hidden>
    <script type="module" src="app.js?v=20260810b"></script>
  </body>
</html>
